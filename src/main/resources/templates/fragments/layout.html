<!-- Layout principal avec Thymeleaf Layout Dialect -->
<!DOCTYPE html>
<html lang="ar" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" dir="rtl">
<head>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
</head>
<body class="font-arabic bg-secondary-50 antialiased" x-data="{ sidebarOpen: false }">
    <!-- CSRF tokens pour AJAX -->
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <!-- Toast container (global) -->
    <div x-data="toast()" class="fixed top-4 left-4 z-50 flex flex-col gap-2" style="display: none;">
        <template x-for="toast in toasts" :key="toast.id">
            <div
                x-show="true"
                x-transition:enter="transition ease-out duration-300"
                x-transition:enter-start="transform opacity-0 -translate-x-full"
                x-transition:enter-end="transform opacity-100 translate-x-0"
                x-transition:leave="transition ease-in duration-300"
                x-transition:leave-start="transform opacity-100 translate-x-0"
                x-transition:leave-end="transform opacity-0 -translate-x-full"
                class="flex items-center gap-3 px-4 py-3 rounded-lg shadow-lg min-w-[300px] max-w-md animate-slide-in"
                :class="{
                    'bg-green-600 text-white': toast.type === 'success',
                    'bg-red-600 text-white': toast.type === 'error',
                    'bg-blue-600 text-white': toast.type === 'info',
                    'bg-yellow-600 text-white': toast.type === 'warning'
                }"
                role="alert"
            >
                <span x-text="toast.message"></span>
                <button @click="remove(toast.id)" class="ml-auto text-white/80 hover:text-white">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
        </template>
    </div>

    <div class="flex h-screen lg:h-full">
        <!-- Sidebar -->
        <th:block th:replace="~{fragments/sidebar :: sidebar}"></th:block>

        <!-- Main Content -->
        <main class="flex-1 overflow-auto lg:ml-0" :class="{ 'lg:ml-64': true }">
            <!-- Navbar -->
            <th:block th:replace="~{fragments/navbar :: navbar}"></th:block>

            <!-- Page Content -->
            <div class="p-4 sm:p-6 lg:p-8">
                <!-- Flash messages (Spring) -->
                <div th:if="${#messages.hasMessages()}" class="mb-6" role="alert">
                    <div th:each="msg : ${#messages.messages()}" th:classappend="|alert alert-${msg.type}|" class="alert">
                        <span th:text="${msg.text}"></span>
                    </div>
                </div>

                <!-- Contenu de la page (injecté par layout:decorate) -->
                <section layout:fragment="content" class="min-h-[calc(100vh-200px)]">
                    <!-- Contenu par défaut -->
                    <div class="text-center py-12 text-secondary-500">
                        <svg class="mx-auto h-12 w-12 text-secondary-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
                        <h2 class="mt-2 text-lg font-medium text-secondary-900">Contenu de la page</h2>
                        <p class="mt-1">Utilisez <code>layout:fragment="content"</code> dans vos templates pour injecter le contenu ici.</p>
                    </div>
                </section>
            </div>

            <!-- Footer -->
            <footer class="border-t border-secondary-200 bg-white">
                <div class="px-4 sm:px-6 lg:px-8 py-4">
                    <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
                        <p class="text-sm text-secondary-500">
                            © <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2024</span> ABIsoft. Tous droits réservés.
                        </p>
                        <div class="flex items-center gap-4 text-sm text-secondary-500">
                            <a href="/mentions-legales" class="hover:text-primary-600">Mentions légales</a>
                            <a href="/confidentialite" class="hover:text-primary-600">Confidentialité</a>
                            <a href="/contact" class="hover:text-primary-600">Contact</a>
                        </div>
                    </div>
                </div>
            </footer>
        </main>
    </div>

    <!-- Scripts globaux -->
    <th:block th:replace="~{fragments/scripts :: scripts}"></th:block>
</body>
</html>
