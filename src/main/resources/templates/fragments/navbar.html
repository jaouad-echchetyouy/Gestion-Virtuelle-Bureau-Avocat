<!-- Navbar / Topbar -->
<header class="bg-white border-b border-secondary-200 sticky top-0 z-40" x-data="dropdown()">
    <div class="flex items-center justify-between h-16 px-4 sm:px-6 lg:px-8">
        <!-- Left: Logo + Menu toggle -->
        <div class="flex items-center gap-4">
            <button
                @click="toggle()"
                class="lg:hidden p-2 rounded-lg text-secondary-500 hover:bg-secondary-100"
                aria-label="Toggle menu"
                aria-expanded="false"
                :aria-expanded="open"
            >
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>

            <a href="/" class="flex items-center gap-2" aria-label="ABIsoft Home">
                <div class="w-8 h-8 bg-primary-600 rounded-lg flex items-center justify-center">
                    <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <span class="text-xl font-bold text-secondary-900 font-arabic">ABIsoft</span>
            </a>
        </div>

        <!-- Center: Search (desktop) -->
        <div class="hidden lg:block flex-1 max-w-md mx-8">
            <div class="relative">
                <svg class="absolute right-3 top-1/2 -translate-y-1/2 w-5 h-5 text-secondary-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
                <input
                    type="search"
                    placeholder="Rechercher un dossier, client..."
                    class="w-full pl-4 pr-10 py-2 bg-secondary-50 border border-secondary-200 rounded-lg text-secondary-900 placeholder-secondary-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent"
                    aria-label="Recherche globale"
                >
            </div>
        </div>

        <!-- Right: Notifications, User menu -->
        <div class="flex items-center gap-2">
            <!-- Notifications -->
            <div class="relative" x-data="dropdown()">
                <button
                    @click="toggle()"
                    @keydown.escape="close()"
                    class="relative p-2 rounded-lg text-secondary-500 hover:bg-secondary-100"
                    aria-label="Notifications"
                    aria-expanded="false"
                    :aria-expanded="open"
                >
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
                    </svg>
                    <span class="absolute top-1 left-1 w-4 h-4 bg-red-500 text-white text-xs font-medium rounded-full flex items-center justify-center">3</span>
                </button>

                <div
                    x-show="open"
                    @click.outside="close()"
                    x-transition:enter="transition ease-out duration-100"
                    x-transition:enter-start="transform opacity-0 scale-95"
                    x-transition:enter-end="transform opacity-100 scale-100"
                    x-transition:leave="transition ease-in duration-75"
                    x-transition:leave-start="transform opacity-100 scale-100"
                    x-transition:leave-end="transform opacity-0 scale-95"
                    class="absolute left-0 mt-2 w-80 bg-white rounded-lg shadow-lg border border-secondary-200 py-2 z-50"
                    role="menu"
                >
                    <div class="px-4 py-3 border-b border-secondary-200 flex items-center justify-between">
                        <h3 class="font-semibold text-secondary-900">Notifications</h3>
                        <a href="#" class="text-sm text-primary-600 hover:underline">Tout voir</a>
                    </div>
                    <div class="max-h-96 overflow-y-auto">
                        <a href="#" class="block px-4 py-3 hover:bg-secondary-50" role="menuitem">
                            <p class="text-sm font-medium text-secondary-900">Nouveau dossier assigné</p>
                            <p class="text-xs text-secondary-500">Dossier #1234 - Il y a 5 min</p>
                        </a>
                        <a href="#" class="block px-4 py-3 hover:bg-secondary-50" role="menuitem">
                            <p class="text-sm font-medium text-secondary-900">Audience programmée</p>
                            <p class="text-xs text-secondary-500">Tribunal de Casablanca - Il y a 1h</p>
                        </a>
                        <a href="#" class="block px-4 py-3 hover:bg-secondary-50" role="menuitem">
                            <p class="text-sm font-medium text-secondary-900">Paiement reçu</p>
                            <p class="text-xs text-secondary-500">Client Ahmed Benali - Il y a 3h</p>
                        </a>
                    </div>
                </div>
            </div>

            <!-- User Menu -->
            <div class="relative" x-data="dropdown()">
                <button
                    @click="toggle()"
                    @keydown.escape="close()"
                    class="flex items-center gap-2 p-1.5 rounded-lg hover:bg-secondary-100"
                    aria-label="Menu utilisateur"
                    aria-expanded="false"
                    :aria-expanded="open"
                >
                    <div class="w-8 h-8 bg-primary-100 rounded-full flex items-center justify-center">
                        <span class="text-primary-700 font-medium text-sm">أ</span>
                    </div>
                    <span class="hidden md:block text-sm font-medium text-secondary-700">أحمد بنعلي</span>
                    <svg class="w-4 h-4 text-secondary-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                    </svg>
                </button>

                <div
                    x-show="open"
                    @click.outside="close()"
                    x-transition:enter="transition ease-out duration-100"
                    x-transition:enter-start="transform opacity-0 scale-95"
                    x-transition:enter-end="transform opacity-100 scale-100"
                    x-transition:leave="transition ease-in duration-75"
                    x-transition:leave-start="transform opacity-100 scale-100"
                    x-transition:leave-end="transform opacity-0 scale-95"
                    class="absolute left-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-secondary-200 py-2 z-50"
                    role="menu"
                >
                    <div class="px-4 py-3 border-b border-secondary-200">
                        <p class="text-sm font-medium text-secondary-900">أحمد بنعلي</p>
                        <p class="text-xs text-secondary-500">Avocat associé</p>
                    </div>
                    <a href="/profile" class="block px-4 py-2 text-sm text-secondary-700 hover:bg-secondary-50" role="menuitem">
                        <svg class="inline w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                        Mon profil
                    </a>
                    <a href="/settings" class="block px-4 py-2 text-sm text-secondary-700 hover:bg-secondary-50" role="menuitem">
                        <svg class="inline w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                        Paramètres
                    </a>
                    <hr class="my-2 border-secondary-200">
                    <form action="/logout" method="post">
                        <button type="submit" class="block w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50" role="menuitem">
                            <svg class="inline w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                            Déconnexion
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</header>
