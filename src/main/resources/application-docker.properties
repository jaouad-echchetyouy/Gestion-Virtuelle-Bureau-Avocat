# Docker profile configuration
spring.datasource.url=jdbc:mysql://db:3306/avocat_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=avocat_user
spring.datasource.password=avocat_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Keep thymeleaf cache disabled for development
spring.thymeleaf.cache=false